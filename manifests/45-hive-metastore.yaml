apiVersion: apps/v1
kind: Deployment
metadata:
  name: hive-metastore
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: &id001
      app: hive-metastore
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: metastore
        image: dataeng-hive-metastore:4.0.0-1
        args:
        - metastore
        env:
        - name: MYSQL_HOST
          value: mysql
        - name: HIVE_DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: user
        - name: HIVE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: password
        - name: HADOOP_HEAPSIZE
          value: '384'
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: 500m
            memory: 768Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: hadoop-config
          mountPath: /etc/hadoop-lab
          readOnly: true
        ports:
        - name: thrift
          containerPort: 9083
        startupProbe:
          tcpSocket:
            port: thrift
          periodSeconds: 5
          failureThreshold: 90
        readinessProbe:
          tcpSocket:
            port: thrift
          periodSeconds: 5
      volumes:
      - name: hadoop-config
        configMap:
          name: hdfs-config
