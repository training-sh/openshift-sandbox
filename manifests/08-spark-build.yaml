apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: dataeng-spark
spec:
  source:
    type: Git
    git:
      uri: https://github.com/training-sh/openshift-sandbox.git
    contextDir: spark-image
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: dataeng-spark:3.5.9-5
  completionDeadlineSeconds: 1800
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 1
