apiVersion: batch/v1
kind: Job
metadata:
  name: hive-schema
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: schema
        image: dataeng-hive-metastore:4.0.0-1
        args:
        - schema
        env:
        - name: MYSQL_HOST
          value: mysql
        - name: HIVE_DB_USER
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: user
        - name: HIVE_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: password
        - name: HADOOP_HEAPSIZE
          value: '384'
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 640Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: hadoop-config
          mountPath: /etc/hadoop-lab
          readOnly: true
      volumes:
      - name: hadoop-config
        configMap:
          name: hdfs-config
      restartPolicy: Never
