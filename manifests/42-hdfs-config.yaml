apiVersion: v1
kind: ConfigMap
metadata:
  name: hdfs-config
data:
  core-site.xml: |
    <configuration>
      <property><name>fs.defaultFS</name><value>hdfs://namenode:9000</value></property>
      <property><name>hadoop.tmp.dir</name><value>/tmp/hadoop-lab</value></property>
    </configuration>
  hdfs-site.xml: |
    <configuration>
      <property><name>dfs.replication</name><value>1</value></property>
      <property><name>dfs.permissions.enabled</name><value>false</value></property>
      <property><name>dfs.namenode.name.dir</name><value>file:///data/namenode</value></property>
      <property><name>dfs.datanode.data.dir</name><value>file:///data/datanode</value></property>
      <property><name>dfs.datanode.hostname</name><value>namenode</value></property>
      <property><name>dfs.client.use.datanode.hostname</name><value>true</value></property>
      <property><name>dfs.namenode.rpc-bind-host</name><value>0.0.0.0</value></property>
      <property><name>dfs.namenode.http-address</name><value>0.0.0.0:9870</value></property>
      <property><name>dfs.namenode.datanode.registration.ip-hostname-check</name><value>false</value></property>
      <property><name>dfs.namenode.safemode.min.datanodes</name><value>1</value></property>
      <property><name>dfs.namenode.safemode.extension</name><value>0</value></property>
    </configuration>
