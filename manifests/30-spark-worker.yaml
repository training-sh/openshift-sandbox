apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-worker
  template:
    metadata:
      labels:
        app: spark-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: spark-worker
        image: dataeng-spark:3.5.9-5
        command: [/opt/spark/bin/spark-class]
        args:
        - org.apache.spark.deploy.worker.Worker
        - --host
        - '$(POD_IP)'
        - --cores
        - '1'
        - --memory
        - 512m
        - --work-dir
        - /tmp/spark-work
        - spark://spark-master-ui:7077
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: SPARK_DAEMON_MEMORY
          value: 256m
        - name: SPARK_LOCAL_DIRS
          value: /tmp/spark-local
        ports:
        - name: ui
          containerPort: 8081
        readinessProbe:
          tcpSocket:
            port: ui
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: '1'
            memory: 1280Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
