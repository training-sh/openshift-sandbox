apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
  - name: s3
    port: 8333
    targetPort: 8333
  - name: admin
    port: 23646
    targetPort: 23646
  - name: master
    port: 9333
    targetPort: 9333
  - name: master-grpc
    port: 19333
    targetPort: 19333
  - name: volume
    port: 9340
    targetPort: 9340
  - name: volume-grpc
    port: 19340
    targetPort: 19340
  - name: filer
    port: 8888
    targetPort: 8888
  - name: filer-grpc
    port: 18888
    targetPort: 18888
