apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: dataeng-hive-metastore
spec:
  source:
    type: Git
    git:
      uri: https://github.com/training-sh/openshift-sandbox.git
    contextDir: hive-image
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: dataeng-hive-metastore:4.0.0-1
  completionDeadlineSeconds: 1800
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 1
